global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ai-orchestrator'
    static_configs:
      - targets: ['ai-orchestrator:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'instrument-gateway'
    static_configs:
      - targets: ['instrument-gateway:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'workflow-engine'
    static_configs:
      - targets: ['workflow-engine:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'data-pipeline'
    static_configs:
      - targets: ['data-pipeline:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
version: '3.8'

services:
  # Database Services
  postgres:
    image: postgres:15-alpine
    container_name: testpilot-postgres-prod
    environment:
      POSTGRES_DB: test_automation
      POSTGRES_USER: testpilot
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    secrets:
      - postgres_password
    networks:
      - testpilot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testpilot"]
      interval: 30s
      timeout: 10s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: testpilot-timescaledb-prod
    environment:
      POSTGRES_DB: timeseries
      POSTGRES_USER: testpilot
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - testpilot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testpilot"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: testpilot-redis-prod
    command: redis-server --requirepass testpilot_redis_prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - testpilot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Message Queue
  nats:
    image: nats:2.10-alpine
    container_name: testpilot-nats-prod
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    networks:
      - testpilot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: testpilot-qdrant-prod
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - testpilot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: testpilot-prometheus-prod
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - testpilot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: testpilot-grafana-prod
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning:ro
    secrets:
      - grafana_password
    networks:
      - testpilot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # AI Orchestrator Service (Production)
  ai-orchestrator:
    build:
      context: .
      dockerfile: docker/ai_orchestrator/Dockerfile.prod
    container_name: testpilot-ai-orchestrator-prod
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://testpilot:testpilot_redis_prod@postgres:5432/test_automation
      TIMESCALE_URL: postgresql://testpilot:testpilot_redis_prod@timescaledb:5432/timeseries
      REDIS_URL: redis://:testpilot_redis_prod@redis:6379
      NATS_URL: nats://nats:4222
      VECTOR_STORE_URL: http://qdrant:6333
      GOOGLE_API_KEY_FILE: /run/secrets/google_api_key
      LOG_LEVEL: INFO
      ENVIRONMENT: production
    secrets:
      - google_api_key
    volumes:
      - ./config:/app/config:ro
      - ai_logs:/var/log/testpilot
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - testpilot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Instrument Gateway Service (Production)
  instrument-gateway:
    build:
      context: .
      dockerfile: docker/instrument_gateway/Dockerfile.prod
    container_name: testpilot-instrument-gateway-prod
    ports:
      - "8002:8000"
    environment:
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://:testpilot_redis_prod@redis:6379
      LOG_LEVEL: INFO
      ENVIRONMENT: production
    volumes:
      - ./config:/app/config:ro
      - instrument_logs:/var/log/testpilot
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - testpilot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Web Interface (Production)
  web-interface:
    build:
      context: .
      dockerfile: docker/web_interface/Dockerfile.prod
    container_name: testpilot-web-interface-prod
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      ai-orchestrator:
        condition: service_healthy
      instrument-gateway:
        condition: service_healthy
    networks:
      - testpilot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  # Nginx Load Balancer (Optional)
  nginx:
    image: nginx:1.25-alpine
    container_name: testpilot-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web-interface
      - ai-orchestrator
      - instrument-gateway
    networks:
      - testpilot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 5

# Secrets for production
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  grafana_password:
    file: ./secrets/grafana_password.txt
  google_api_key:
    file: ./secrets/google_api_key.txt

volumes:
  postgres_data:
    driver: local
  timescaledb_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  ai_logs:
    driver: local
  instrument_logs:
    driver: local

networks:
  testpilot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
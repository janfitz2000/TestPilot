[package]
name = "instrument_gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
async-nats = "0.33"
redis = { version = "0.24", features = ["tokio-comp"] }
prometheus = "0.13"
regex = "1.10"
bytes = "1.5"
base64ct = "=1.7.3"

# SCPI/VISA communication
tokio-serial = "5.4"
visa-rs = { version = "0.1", optional = true }

# Configuration
config = "0.13"
clap = { version = "4.0", features = ["derive"] }
async-trait = "0.1"

[features]
default = []
visa = ["visa-rs"]

[workspace]
resolver = "2"